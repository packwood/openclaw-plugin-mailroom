name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm run test:all
      - run: npm run verify:package
      - run: npm install --global clawhub@0.23.1
      - run: clawhub package validate .
      - name: Build exact release artifact
        id: artifact
        run: |
          artifact="$(npm pack --ignore-scripts --silent | tail -n 1)"
          test -n "$artifact"
          test -f "$artifact"
          tar -tzf "$artifact" | grep -qx 'package/dist/index.js'
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
      - name: Validate exact release artifact
        run: >-
          clawhub package publish "${{ steps.artifact.outputs.path }}"
          --family code-plugin
          --source-repo "$GITHUB_REPOSITORY"
          --source-commit "$GITHUB_SHA"
          --source-ref "$GITHUB_REF"
          --tags latest
          --dry-run
          --json
      - name: Publish exact release artifact
        run: >-
          clawhub package publish "${{ steps.artifact.outputs.path }}"
          --family code-plugin
          --source-repo "$GITHUB_REPOSITORY"
          --source-commit "$GITHUB_SHA"
          --source-ref "$GITHUB_REF"
          --tags latest
          --json

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes

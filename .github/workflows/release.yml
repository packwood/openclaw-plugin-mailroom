name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm run test:all
      - run: npm run verify:package
      - run: npm install --global clawhub@0.23.1
      - run: clawhub package validate .
      - name: Publish to ClawHub
        run: >-
          clawhub package publish .
          --family code-plugin
          --source-repo "$GITHUB_REPOSITORY"
          --source-commit "$GITHUB_SHA"
          --source-ref "$GITHUB_REF_NAME"
          --json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
